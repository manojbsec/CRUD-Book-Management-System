<!DOCTYPE html>
<html>
<head>
    <title>Book Management</title>
</head>
<body>
    <h1>Book Management System</h1>

    <a href="{% url 'book_create' %}">
        Add Book
    </a>

    <hr>

    <table border="1" cellpadding="10">
        <tr>
            <th>title</th>
            <th>author</th>
            <th>price</th>
            
        </tr>

        {% for book in books %}
        <tr>
            <td>{{ book.title }}</td>
            <td>{{ book.author }}</td>
            <td>{{ book.price }}</td>
            <td>
                <a href="{% url 'book_update' book.title %}">
                    Edit
                </a>

                <form method="POST"
                      action="{% url 'book_delete' book.title %}"
                      style="display:inline;">
                    {% csrf_token %}
                    <button type="submit">Delete</button>
                </form>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="4">No books found</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
